name: Docker branch Images build

on:
  push:
    branches:
      - master
      - development
      - stage
      - test
  release:
    types: [published]
jobs:
  # Build only from commits that pass both test suites
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  system_tests:
    uses: ./.github/workflows/tests-system.yml
    secrets: inherit

  # A reusable workflow runs no steps of ours: read .ruby-version here
  ruby:
    name: Read Ruby version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

  # One native runner per platform (arm64 on ubuntu-*-arm, no QEMU),
  # then a final job merges both digests into one multi-arch tag
  push_to_registry:
    name: Push Docker branch image to Docker Hub
    needs: [ tests, system_tests, ruby ]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write   # signs the GHA cache entries
      packages: write   # GHCR push
    with:
      output: image
      push: true
      sign: false
      platforms: linux/amd64,linux/arm64
      build-args: RUBY_VERSION=${{ needs.ruby.outputs.version }}
      cache: true
      cache-mode: max
      set-meta-labels: true
      meta-images: |
        agroportal/ontoportal_web_ui
        ghcr.io/${{ github.repository }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
