name: Docker branch Images build

on:
  push:
    branches:
      - master
      - development
      - stage
      - test
  release:
    types: [published]
jobs:
  # Build only from commits that pass both test suites
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  system_tests:
    uses: ./.github/workflows/tests-system.yml
    secrets: inherit

  push_to_registry:
    name: Push Docker branch image to Docker Hub
    needs: [ tests, system_tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            agroportal/ontoportal_web_ui
            ghcr.io/${{ github.repository }}

      - name: Read Ruby version
        id: ruby
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: |
            RUBY_VERSION=${{ steps.ruby.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
