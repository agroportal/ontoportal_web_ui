# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby
name: "Run system tests CI"

on:
  # docker-image.yml runs these tests itself on the branches it builds
  push:
    branches-ignore: [ master, development, stage, test ]
  pull_request:
    types: [ opened, reopened ]
  workflow_call:
env:
  API_URL: http://localhost:9393
  BIOMIXER_URL: ${{ secrets.BIOMIXER_URL }}
  FAIRNESS_URL: ${{ secrets.FAIRNESS_URL }}
  ANNOTATOR_URL: ${{ secrets.ANNOTATOR_URL }}
  DB_HOST: 127.0.0.1
  AGENTS_ENABLED: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: root
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      chrome-server:
        image: selenium/standalone-chrome:112.0-chromedriver-112.0-grid-4.9.0-20230421
        options: "--shm-size=2g"
        ports:
          - "4444:4444"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Add or replace dependency steps here
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Run OntoPortal API
        run: bin/run_api

      # Add or replace database setup steps here
      - name: set up config file
        run: cp config/database.yml.sample config/database.yml
      - name: Set up database schema
        run: RAILS_ENV=test bin/rails db:setup
      - name: Set up yarn
        run: yarn install
      # Add or replace test runners here
      - name: Run integration tests
        run:  |
          CI=true RAILS_ENV=test bin/rails assets:clobber
          CI=true RAILS_ENV=test bin/rails  assets:precompile
          CI=true RAILS_ENV=test bin/rails test -v test/system/*

      # A failed system test only says what was missing on the page; the UI
      # and API logs say what the server answered instead
      - name: Collect failure logs
        if: failure()
        run: bin/api_logs tmp/api_logs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-tests-logs-attempt-${{ github.run_attempt }}
          path: |
            log/test.log
            tmp/screenshots
            tmp/api_logs
          retention-days: 14